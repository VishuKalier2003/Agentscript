<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Society Overview</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #e3e6ec;
  --accent: #5b4bdb; --accent-soft: #ecebfd;
  --ok: #1f8a4c; --ok-soft: #e4f4ea; --warn: #a96a00; --warn-soft: #fbf0d9;
  --bad: #c43232; --bad-soft: #fbe5e5; --info: #2d6cc0; --info-soft: #e3eefb;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141a; --panel: #1b1e26; --text: #e6e8ee; --muted: #9aa2b4; --line: #2b2f3a;
    --accent: #9b8fff; --accent-soft: #2a2650;
    --ok: #4cc27f; --ok-soft: #173826; --warn: #e3a33a; --warn-soft: #3a2c12;
    --bad: #f07272; --bad-soft: #3d1c1c; --info: #6ea8ff; --info-soft: #182a44;
  }
}
:root[data-theme="dark"] {
  --bg: #12141a; --panel: #1b1e26; --text: #e6e8ee; --muted: #9aa2b4; --line: #2b2f3a;
  --accent: #9b8fff; --accent-soft: #2a2650;
  --ok: #4cc27f; --ok-soft: #173826; --warn: #e3a33a; --warn-soft: #3a2c12;
  --bad: #f07272; --bad-soft: #3d1c1c; --info: #6ea8ff; --info-soft: #182a44;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; }
.brand { font-weight: 650; font-size: 16px; margin-right: 8px; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; letter-spacing: .02em; }
nav a { padding: 4px 8px; border-radius: 6px; color: var(--muted); }
nav a.on { color: var(--text); background: var(--bg); }
.spacer { flex: 1; }
select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.filters { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter { position: relative; }
.filter > button.set { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; width: 260px; max-height: 320px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.menu input[type=search] { width: 100%; margin-bottom: 6px; }
.menu label { display: flex; gap: 6px; align-items: center; padding: 3px 4px; border-radius: 4px; cursor: pointer; overflow-wrap: anywhere; }
.menu label:hover { background: var(--bg); }
.menu .none { color: var(--muted); padding: 4px; }
main { padding: 16px; max-width: 1600px; margin: 0 auto; }
h1 { font-size: 22px; line-height: 1.25; font-weight: 680; margin: 6px 0 4px; overflow-wrap: anywhere; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 650; color: var(--text); margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
h2 .count, h1 .count { color: var(--muted); font-weight: 500; }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.group h3 { margin: 0 0 6px; font-size: 11px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .06em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.tile { display: block; padding: 6px 8px; border-radius: 8px; color: var(--text); }
a.tile:hover { background: var(--bg); text-decoration: none; box-shadow: inset 0 0 0 1px var(--line); }
a.tile .l::after { content: " →"; color: var(--accent); opacity: 0; transition: opacity .1s; }
a.tile:hover .l::after, a.tile:focus .l::after { opacity: 1; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile .l abbr { text-decoration: none; cursor: help; }
.tile.bad .v { color: var(--bad); } .tile.warn .v { color: var(--warn); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.chart .t { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.chart .t b { color: var(--text); font-size: 14px; font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: 64px; display: block; margin-top: 6px; }
.chart.activity svg { height: 120px; }
.level-row { display: grid; grid-template-columns: minmax(80px, 30%) 1fr auto; gap: 8px; align-items: center; margin: 4px 0; }
.level-row a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.level-bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--bg); }
.level-bar span { display: block; height: 100%; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.legend { margin-bottom: 8px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; background: var(--panel); }
tr:last-child td { border-bottom: 0; }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover { background: var(--bg); }
tr.focus { outline: 2px solid var(--accent); outline-offset: -2px; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.badge { display: inline-block; font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 4px; letter-spacing: .03em; white-space: nowrap; background: var(--bg); color: var(--muted); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.info { background: var(--info-soft); color: var(--info); }
.stream { list-style: none; margin: 0; padding: 0; }
.stream li a { display: grid; grid-template-columns: 76px 120px 110px 1fr auto; gap: 4px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--text); align-items: baseline; }
.stream li:last-child a { border-bottom: 0; }
.stream li a:hover { background: var(--bg); text-decoration: none; }
.stream .d { overflow-wrap: anywhere; }
.stream .x { grid-column: 4 / 6; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.fact { padding: 4px 0 4px 10px; border-left: 2px solid var(--line); }
.fact .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fact .val { font-weight: 600; overflow-wrap: anywhere; }
.lifecycle { display: flex; flex-wrap: wrap; gap: 4px; }
.lifecycle span { padding: 4px 8px; border-radius: 6px; background: var(--bg); color: var(--muted); font-size: 12px; }
.lifecycle span.done { background: var(--ok-soft); color: var(--ok); }
.lifecycle span.now { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
details summary { cursor: pointer; color: var(--accent); }
nav.sections { display: flex; flex-wrap: wrap; gap: 4px; margin: 12px 0 0; }
nav.sections a.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
nav.sections a { padding: 3px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; }
section { scroll-margin-top: 120px; }
h3 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 650; }
.panel h3 { margin-top: 0; }
.contract { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; margin-top: 10px; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 2px 0; overflow-wrap: anywhere; }
.prose { white-space: pre-wrap; margin: 4px 0 8px; overflow-wrap: anywhere; }
pre.code { white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px; background: var(--bg); border-radius: 6px; }
.small { font-size: 12px; }
tr.risk-high td:first-child, tr.risk-critical td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
tr.risk-medium td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.panel.note { margin-bottom: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 10px; }
.toolbar input[type=search] { min-width: 260px; flex: 1 1 260px; }
.wide { max-height: calc(100vh - 300px); overflow: auto; }
.wide table { min-width: 2100px; }
.wide thead th { position: sticky; top: 0; z-index: 1; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 0; }
.pager span { color: var(--muted); }
.inspections { display: grid; gap: 6px; }
details.inspect { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
details.inspect[open] { box-shadow: 0 0 0 2px var(--accent-soft); }
details.inspect.risk-high { border-left: 3px solid var(--bad); }
details.inspect.risk-medium { border-left: 3px solid var(--warn); }
details.inspect summary { color: var(--text); }
details.inspect .facts { margin: 8px 0; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
.note { padding: 12px; color: var(--muted); }
.error { margin: 16px; padding: 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); }
.empty { padding: 16px; color: var(--muted); text-align: center; }
.info { display: inline-block; margin-left: 3px; color: var(--muted); cursor: help; font-size: 11px; font-style: normal; }
.info:hover, .info:focus { color: var(--accent); outline: none; }
nav.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
nav.crumbs .sep { opacity: .6; }
nav.crumbs .here { color: var(--text); font-family: var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 4px 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip button { border: 0; background: transparent; color: inherit; padding: 0 4px; font-size: 14px; line-height: 1; }
th.sortable::after { content: " ↕"; opacity: .35; }
th.sorted-asc::after { content: " ↑"; opacity: 1; }
th.sorted-desc::after { content: " ↓"; opacity: 1; }
.virtual { overflow-y: auto; position: relative; contain: strict; }
.vrow { display: grid; align-items: center; gap: 4px 12px; padding: 0 12px; border-bottom: 1px solid var(--line); cursor: pointer; overflow: hidden; }
.vrow:hover, .vrow:focus { background: var(--bg); outline: none; }
.vrow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow.stream-row { grid-template-columns: 76px 120px 110px 1fr auto; }
.vrow.timeline-row { grid-template-columns: 170px 96px minmax(160px, 1.2fr) 150px 1fr; }
#panel-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 40; }
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 41; display: flex; flex-direction: column; box-shadow: -12px 0 32px rgba(0,0,0,.18); }
#panel > header { position: static; display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
#panel > header h2 { margin: 0; padding: 0; border: 0; flex: 1; }
#panel .body { padding: 12px 16px; overflow: auto; }
#panel .facts { grid-template-columns: 1fr 1fr; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.links a { padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; }
@media (max-width: 720px) {
  .stream li a { grid-template-columns: 70px 1fr auto; }
  .stream .a { display: none; }
  .stream .x { grid-column: 1 / 4; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">Society</span><span class="pill">READ-ONLY</span>
    <nav id="nav"></nav>
    <span class="spacer"></span>
    <input id="search" type="search" placeholder="Search activity" aria-label="Search activity" size="18">
    <select id="range" aria-label="Time range">
      <option value="15m">Last 15 minutes</option><option value="1h">Last 1 hour</option>
      <option value="6h">Last 6 hours</option><option value="24h">Last 24 hours</option>
      <option value="7d">Last 7 days</option><option value="30d">Last 30 days</option>
      <option value="custom">Custom range</option>
    </select>
    <span id="custom" hidden>
      <input id="from" type="datetime-local" aria-label="From"> – <input id="to" type="datetime-local" aria-label="To">
    </span>
    <span id="viewer" class="muted small"></span>
    <span id="updated" class="muted"></span>
    <button id="theme" type="button" title="Switch between the system, light, and dark themes">Theme: system</button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"><div class="note">Loading…</div></main>
<div id="panel-backdrop" hidden></div>
<aside id="panel" hidden aria-label="Details"><header><h2 id="panel-title"></h2><button type="button" id="panel-close" aria-label="Close the details">×</button></header><div class="body" id="panel-body"></div></aside>
<script>
"use strict";
// The Society Overview: a read-only view of the observability API. It only ever issues GET
// requests; it has no control that changes anything. Global filters and the time range live in
// one state object, kept in the URL and in local storage, so they persist across pages.

const FILTERS = [
  ["repository", "Repository"], ["task", "Task ID"], ["agent", "Agent"], ["provider", "Agent provider"],
  ["session", "Session / Run"], ["policy", "Policy"], ["policy_version", "Policy version"], ["zone", "Zone"],
  ["autonomy", "Autonomy mode"], ["safety", "Safety state"], ["task_status", "Task status"],
  ["session_status", "Session status"], ["severity", "Violation severity"], ["verification", "Verification"],
  ["delivery", "Delivery"], ["environment", "Environment"], ["branch", "Branch"], ["team", "User / team"],
];
const GROUPS = [
  ["Now", ["active_tasks", "active_sessions", "autonomous_sessions", "quarantined_sessions"]],
  ["Outcomes", ["completed_tasks", "failed_tasks", "tasks_completed", "prs_created", "prs_merged"]],
  ["Quality", ["verification_failures", "verification_pass_rate", "policy_violations", "critical_violations", "average_violations_per_session"]],
  ["Autonomy", ["autonomous_completion_rate", "human_intervention_rate", "average_autonomy_score", "average_budget_consumption", "average_task_duration", "average_session_duration"]],
];
const ALARM = { failed_tasks: "bad", verification_failures: "bad", critical_violations: "bad", quarantined_sessions: "bad", policy_violations: "warn" };
const STORE = "society.observe.state";

// --- small helpers (text only: record data is never parsed as HTML)
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
function svg(tag, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  return node;
}
const pad = n => String(n).padStart(2, "0");
const clock = s => { const d = new Date(s * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const stamp = s => s ? new Date(s * 1000).toLocaleString() : "—";
function duration(seconds) {
  if (seconds === null || seconds === undefined) return "—";
  const s = Math.round(seconds);
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
  return `${Math.floor(s / 86400)}d ${Math.floor((s % 86400) / 3600)}h`;
}
function badge(text) {
  const t = String(text || "—").toUpperCase();
  const kind = /^(ALLOW|PASS|PASSED|MERGED|COMPLETED|ACTIVE|APPROVAL|APPROVED|START|VERIFIED)/.test(t) ? "ok"
    : /^(DENY|FAIL|FAILED|QUARANTINED|CRITICAL|BLOCKED|CANCELLED|BROKEN|REJECTION)/.test(t) || t.includes("QUARANTINED") ? "bad"
    : /^(ASK|DEGRADED|APPROVAL_REQUIRED|PENDING|NON_CRITICAL|FINDING)/.test(t) || t.includes("DEGRADED") ? "warn" : "info";
  return h("span", { class: `badge ${kind}` }, t.replaceAll("_", " "));
}

// --- shared interaction helpers: drill-down links, explanations, breadcrumbs, the side panel,
// sortable tables, and virtualized lists (all navigation; nothing here changes a record)
function drill(path, extra) {
  const query = new URLSearchParams(stateQuery());
  for (const [key, value] of Object.entries(extra || {})) {
    if (value === null || value === undefined || value === "") query.delete(key);
    else query.set(key, Array.isArray(value) ? value.join(",") : String(value));
  }
  return `#${path}?${query}`;
}
function info(text) { return text ? h("span", { class: "info", tabindex: "0", title: text, "aria-label": text }, "ⓘ") : ""; }
function tile(label, value, options = {}) {
  const body = [h("div", { class: "v" }, value === null || value === undefined || value === "" ? "—" : value), h("div", { class: "l" }, label, info(options.definition))];
  const kind = `tile ${options.kind || ""}`;
  if (options.section) return h("a", { class: kind, href: `#section-${options.section}`, title: options.hint || "Show the records behind this number below", onclick: event => { event.preventDefault(); const target = document.getElementById(`section-${options.section}`); if (target) { if (target.tagName === "DETAILS") target.open = true; target.scrollIntoView({ behavior: "smooth" }); } } }, ...body);
  return options.href ? h("a", { class: kind, href: options.href, title: options.hint || "Open the records behind this number" }, ...body) : h("div", { class: kind }, ...body);
}
function crumbs(...parts) {
  return h("nav", { class: "crumbs", "aria-label": "Breadcrumb" }, parts.flatMap((part, index) => [
    index ? h("span", { class: "sep" }, "/") : "",
    Array.isArray(part) ? h("a", { href: part[1] }, part[0]) : h("span", { class: "here" }, part)]));
}
// A list the server bounded says how many it holds of how many there are
function ofTotal(items, total) {
  const shown = (items || []).length;
  return total === undefined || total === null || total <= shown ? `${shown}` : `${shown} of ${total}, newest`;
}
function when(seconds) { return seconds ? h("time", { datetime: String(seconds), title: new Date(seconds * 1000).toISOString() }, stamp(seconds)) : "—"; }
const ENTITY = { policies: "policy", zones: "zone", agents: "agent", tasks: "task", runs: "run" };
function links(kind, names, stop) {
  const values = (names || []).filter(Boolean);
  if (!values.length) return "—";
  return values.flatMap((name, index) => {
    const target = kind === "policies" ? String(name).split("/")[0] : String(name);
    return [index ? ", " : "", h("a", { href: `#/${kind}/${encodeURIComponent(target)}`, title: `Open ${ENTITY[kind] || kind} ${target}`, onclick: stop ? event => event.stopPropagation() : null }, String(name))];
  });
}
// The side panel shows one record's details without leaving the page
const panel = document.getElementById("panel");
const backdrop = document.getElementById("panel-backdrop");
function openPanel(title, ...children) {
  document.getElementById("panel-title").textContent = title;
  document.getElementById("panel-body").replaceChildren(...children);
  panel.hidden = false; backdrop.hidden = false;
  document.getElementById("panel-close").focus();
}
function closePanel() { panel.hidden = true; backdrop.hidden = true; }
document.getElementById("panel-close").addEventListener("click", closePanel);
backdrop.addEventListener("click", closePanel);
document.addEventListener("keydown", event => { if (event.key === "Escape" && !panel.hidden) closePanel(); });
// Any table whose rows are all on the page sorts by a header click (paginated tables sort on the server)
function cellValue(cell) {
  const time = cell && cell.querySelector("time");
  if (time) return Number(time.getAttribute("datetime"));
  const text = (cell ? cell.textContent : "").trim();
  const number = text.replace(/[,%]/g, "");
  return /^[-+]?\d+(\.\d+)?$/.test(number) ? Number(number) : text.toLowerCase();
}
function sortable(tableNode) {
  if (!tableNode || tableNode.dataset.server || tableNode.dataset.sortable) return;
  tableNode.dataset.sortable = "1";
  const headers = [...tableNode.querySelectorAll("thead th")];
  headers.forEach((header, column) => {
    if (header.classList.contains("sortable")) return;
    header.classList.add("sortable");
    header.title = header.title || "Sort";
    header.addEventListener("click", () => {
      const ascending = !header.classList.contains("sorted-asc");
      headers.forEach(other => other.classList.remove("sorted-asc", "sorted-desc"));

    }) : h("div", { class: "muted" }, "No mutating actions in this range"));

// --- routing
let timer = null;
async function route() {
  clearTimeout(timer);
  state = Object.assign(state, (() => { const next = readState(); return { range: next.range, from: next.from, to: next.to, filters: next.filters }; })());
  saveState();
  syncRange();
  renderFilters();
  const [path, query] = location.hash.slice(1).split("?");
  const parts = (path || "/overview").split("/").filter(Boolean).map(decodeURIComponent);
  renderNav(parts[0] || "overview");
  showViewer();
  const main = document.getElementById("main");
  closePanel();
  if (!token) {
    main.replaceChildren(h("div", { class: "error" }, "Open the link that 'crane observe serve' printed (it carries the access token)."));
    return;
  }
  try {
    if ((parts[0] === "runs" || parts[0] === "sessions") && parts[1]) await runPage(parts[1], new URLSearchParams(query || "").get("seq"));
    else if (parts[0] === "runs") await runsPage();
    else if (parts[0] === "policies" && parts[1]) await policyPage(parts[1]);
    else if (parts[0] === "policies") await policiesPage();
    else if (parts[0] === "zones" && parts[1]) await zonePage(parts[1]);
    else if (parts[0] === "zones") await zonesPage();
    else if (parts[0] === "violations") await violationsPage();
    else if (parts[0] === "autonomy") await autonomyPage();
    else if (parts[0] === "repositories" && parts[1]) await repositoryPage(parts[1]);
    else if (parts[0] === "repositories") await repositoriesPage();
    else if (parts[0] === "tasks" && parts[1]) await taskPage(parts[1]);
    else if (parts[0] === "tasks") await tasksPage();
    else if (parts[0] === "agents" && parts[1]) await agentPage(parts[1]);
    else if (parts[0] === "agents") await agentsPage();
    else { await overview(); timer = setTimeout(route, 30000); }
    main.querySelectorAll("table").forEach(sortable);
  } catch (error) {
    main.replaceChildren(h("div", { class: "error" }, `Could not load: ${error.message}`));
  }
}
window.addEventListener("hashchange", route);
if (!location.hash) history.replaceState(null, "", "#/overview?" + stateQuery());
route();
