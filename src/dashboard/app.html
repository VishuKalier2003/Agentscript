<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crane Control Plane</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #18202b; --muted: #5d6877; --line: #dde2e8;
  --accent: #2456c7; --accent-ink: #ffffff; --good: #1d7a46; --warn: #a15c00; --bad: #b3261e; --chip: #eef1f5;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11151b; --panel: #181e26; --ink: #e6ebf1; --muted: #98a3b1; --line: #2a333e;
    --accent: #7aa2ff; --accent-ink: #0b1220; --good: #5cc98b; --warn: #f0b45b; --bad: #ff8a80; --chip: #222b36; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
header .repo { color: var(--muted); font-size: 12px; margin-left: auto; font-family: var(--mono); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button[aria-current="page"] { background: var(--chip); color: var(--ink); font-weight: 600; }
main { padding: 20px; max-width: 1240px; margin: 0 auto; }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
h2 { font-size: 16px; margin: 0 0 12px; } h3 { font-size: 13px; margin: 16px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--chip); }
code, pre, .mono { font-family: var(--mono); font-size: 12px; }
pre { background: var(--chip); padding: 10px; border-radius: 8px; overflow: auto; margin: 0; white-space: pre-wrap; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; margin: 1px 2px; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; min-height: 180px; font-family: var(--mono); font-size: 12px; }
button.act { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
button.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } main { padding: 12px; } }
.notice { padding: 10px 12px; border-radius: 8px; background: var(--chip); margin: 8px 0; }
</style>
</head>
<body>
<header>
  <h1>Crane</h1>
  <nav id="nav"></nav>
  <div class="repo" id="repo"></div>
</header>
<main id="main"></main>
<script>
"use strict";
const SCREENS = ["Repository", "Zones", "Contracts", "Agent Sessions", "Policy Simulator", "Attestations"];
const params = new URLSearchParams(location.search);
let token = params.get("token") || sessionStorage.getItem("craneToken") || "";
if (params.get("token")) { sessionStorage.setItem("craneToken", token); history.replaceState(null, "", "/"); }
let current = sessionStorage.getItem("craneScreen") || "Repository";
let draft = {name: "", checkpoint: "baseline", rules: [{rule: "preserve", kind: "function", target: "", scope: "block", change_type: ""}]};
let targets = [];

/* Build DOM nodes without ever interpreting data as HTML */
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== null && value !== undefined && value !== false) node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) node.append(child instanceof Node ? child : String(child));
  return node;
}
const text = value => value === null || value === undefined ? "–" : (typeof value === "object" ? JSON.stringify(value) : String(value));
function table(headers, rows, onclick) {
  return h("table", {}, h("thead", {}, h("tr", {}, headers.map(name => h("th", {}, name)))),
    h("tbody", {}, rows.length ? rows.map((cells, index) => h("tr", onclick ? {class: "click", onclick: () => onclick(index)} : {}, cells.map(cell => h("td", {}, cell))))
      : h("tr", {}, h("td", {colspan: headers.length, class: "muted"}, "Nothing yet."))));
}
const stat = (value, label) => h("div", {class: "stat"}, h("b", {}, text(value)), h("span", {}, label));
const panel = (title, ...children) => h("section", {class: "panel"}, title ? h("h2", {}, title) : null, ...children);
const tone = value => /pass|passed|active|resolved|approved|merged|verified|routine/i.test(value) ? "good" : /fail|denied|deny|quarantined|missing|rejected|broken|restricted|critical/i.test(value) ? "bad" : "warn";
const badge = value => h("span", {class: "chip " + tone(String(value))}, text(value));

async function api(method, path, body) {
  const response = await fetch(path, {method, headers: {"X-Crane-Token": token, "Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  const value = await response.json();
  if (!response.ok) { const error = new Error(value.error || response.status); error.status = response.status; throw error; }
  return value;
}

function navigate(screen) { current = screen; sessionStorage.setItem("craneScreen", screen); render(); }
async function render() {
  document.getElementById("nav").replaceChildren(...SCREENS.map(name => h("button", {"aria-current": name === current ? "page" : false, onclick: () => navigate(name)}, name)));
  const main = document.getElementById("main");
  main.replaceChildren(h("p", {class: "muted"}, "Loading…"));
  if (!token) { main.replaceChildren(panel("Open the dashboard from its link", h("p", {}, "Run ", h("code", {}, "crane dashboard"), " and open the printed link; it carries the access token."))); return; }
  try {
    const connection = await api("GET", "/api/connection");
    if (!connection) { main.replaceChildren(connectPanel()); return; }
    document.getElementById("repo").textContent = (connection.remote || connection.root) + " · " + (connection.default_branch || "");
    main.replaceChildren(await ({"Repository": repositoryScreen, "Zones": zonesScreen, "Contracts": contractsScreen, "Agent Sessions": sessionsScreen, "Policy Simulator": simulatorScreen, "Attestations": attestationsScreen})[current]());
  } catch (error) { main.replaceChildren(panel("Something went wrong", h("p", {class: "bad"}, error.message))); }
}

function connectPanel() {
  return panel("Connect this repository",
    h("p", {}, "Crane connects once: it records the repository's identity, remote, default branch, and languages, and every screen works from that and Crane's own records afterwards."),
    h("button", {class: "act", onclick: async () => { await api("POST", "/api/connection", {}); render(); }}, "Connect repository"));
}

async function repositoryScreen() {
  const data = await api("GET", "/api/repository");
  targets = data.inventory.targets;
  const repo = data.inventory.repository, coverage = data.policy_coverage;
  return h("div", {},
    panel("Semantic inventory", h("div", {class: "stats"},
      stat(repo.files, "files"), stat(repo.symbols, "symbols"), stat((data.inventory.services || []).length, "services"), stat((data.inventory.modules || []).length, "modules"),
      stat(coverage.callables_percent + "%", "functions covered by contracts"), stat(coverage.critical_covered + " / " + coverage.critical, "critical candidates covered")),
      h("h3", {}, "Languages"), table(["Language", "Files", "Symbols", "Enforceable"], data.inventory.languages.map(language => [language.language, language.files, language.symbols, language.enforceable ? "yes" : "discovery only"])),
      h("h3", {}, "Services"), table(["Service", "Files", "Symbols", "Languages"], (data.inventory.services || []).map(service => [h("code", {}, service.id), service.files, service.symbols, (service.languages || []).join(", ")]))),
    panel("Critical regions",
      table(["Symbol", "Risk", "Signals", "Covered by", "Suggested rule"], (data.critical_regions.candidates || []).map(candidate => [h("code", {}, candidate.id), candidate.risk_score, (candidate.risk_signals || []).join(", "), (candidate.covered_by || []).join(", ") || h("span", {class: "warn"}, "uncovered"), candidate.suggestion ? h("code", {}, candidate.suggestion) : text(candidate.suggestion_note)])),
      h("h3", {}, "Critical and restricted zones"), table(["Zone", "Criticality", "Files"], data.critical_regions.zones.map(zone => [zone.zone, badge(zone.criticality), (zone.files || []).length]))),
    panel("Policy coverage and unresolved targets", h("div", {class: "stats"}, stat(coverage.callables_covered + " / " + coverage.callables, "functions covered"), stat(coverage.entities_covered + " / " + coverage.entities, "symbols covered"), stat(data.unresolved_targets.length, "unresolved targets")),
      table(["Policy", "Rule", "Target", "Status"], data.unresolved_targets.map(clause => [clause.policy_id, clause.rule, h("code", {}, clause.kind + " " + clause.target), badge(clause.status)]))));
}

async function zonesScreen() {
  const data = await api("GET", "/api/zones");
  return panel("Zones",
    table(["Zone", "Selectors", "Criticality", "Autonomy (declared → effective)", "Safety state", "Resolved resources"],
      (data.zones || []).map(zone => [h("b", {}, zone.zone_id),
        h("div", {}, zone.selectors.map(selector => h("div", {}, h("code", {}, selector.selector), " ", badge(selector.status)))),
        badge(zone.criticality), zone.default_autonomy + " → " + zone.effective_autonomy, badge(zone.effective_safety_state),
        h("div", {}, h("span", {class: "chip"}, zone.files.length + " files"), h("span", {class: "chip"}, zone.entities.length + " symbols"), h("details", {}, h("summary", {}, "files"), h("pre", {}, zone.files.join("\n"))))])),
    data.conflicts && data.conflicts.length ? h("div", {class: "notice warn"}, data.conflicts.length + " conflicts: " + text(data.conflicts)) : null);
}

function editorRows(onchange) {
  const kinds = ["function", "class", "interface", "data", "variable"], scopes = ["block", "file", "flow", "folder", "all"], changes = ["", "logical_bn", "logical_cn", "logical_sn", "semantic"];
  const select = (options, value, set) => h("select", {onchange: event => { set(event.target.value); onchange(); }}, options.map(option => h("option", {value: option, selected: option === value}, option || "any change")));
  return h("div", {},
    h("datalist", {id: "targets"}, targets.map(target => h("option", {value: target.qualified}))),
    draft.rules.map((rule, index) => h("div", {class: "row"},
      select(["preserve", "target"], rule.rule, value => rule.rule = value), select(kinds, rule.kind, value => rule.kind = value),
      h("input", {list: "targets", placeholder: "PaymentService.charge", value: rule.target, oninput: event => { rule.target = event.target.value; onchange(); }}),
      select(scopes, rule.scope, value => rule.scope = value), rule.rule === "target" ? select(changes, rule.change_type || "", value => rule.change_type = value) : null,
      h("button", {class: "ghost", onclick: () => { draft.rules.splice(index, 1); render(); }}, "Remove"))),
    h("button", {class: "ghost", onclick: () => { draft.rules.push({rule: "preserve", kind: "function", target: "", scope: "block", change_type: ""}); render(); }}, "Add rule"));
}

async function contractsScreen() {
  const [data, packs] = await Promise.all([api("GET", "/api/contracts"), api("GET", "/api/packs")]);
  if (!targets.length) { try { targets = (await api("GET", "/api/repository")).inventory.targets; } catch (error) { /* the editor still works without suggestions */ } }
  const preview = h("pre", {}, "…"), problems = h("div", {}), advanced = h("textarea", {spellcheck: "false"}), status = h("div", {});
  const refresh = async () => {
    const result = await api("POST", "/api/contracts/preview", draft);
    preview.textContent = result.valid ? result.agentscript : "—";
    problems.replaceChildren(...result.problems.map(problem => h("div", {class: "bad"}, problem)));
    if (result.valid) advanced.value = result.agentscript;
  };
  const propose = async body => {
    try { const result = await api("POST", "/api/contracts", body); status.replaceChildren(h("div", {class: "notice"}, "Proposal ", h("b", {}, result.proposal), " is pending review. Nothing is enforced until a human approves it.")); }
    catch (error) { status.replaceChildren(h("div", {class: "notice bad"}, error.message)); }
  };
  const editor = panel("Visual policy editor",
    h("div", {class: "row"}, "Policy ", h("input", {value: draft.name, placeholder: "payments_core", oninput: event => { draft.name = event.target.value; refresh(); }}), " checkpoint ", h("input", {value: draft.checkpoint, oninput: event => { draft.checkpoint = event.target.value; refresh(); }})),
    editorRows(refresh), problems,
    h("div", {class: "split"}, h("div", {}, h("h3", {}, "Generated AgentScript"), preview),
      h("div", {}, h("details", {}, h("summary", {}, "Advanced: edit AgentScript"), advanced,
        h("div", {class: "row"}, h("button", {class: "ghost", onclick: async () => { const parsed = await api("POST", "/api/contracts/parse", {agentscript: advanced.value}); draft = parsed.draft; render(); }}, "Load into the visual editor"),
          h("button", {class: "ghost", onclick: () => propose({agentscript: advanced.value})}, "Propose this AgentScript"))))),
    h("div", {class: "row"}, h("button", {class: "act", onclick: () => propose({draft})}, "Propose policy"), h("button", {class: "ghost", onclick: () => navigate("Policy Simulator")}, "Simulate first")), status);
  refresh();
  const detail = h("div", {});
  const open = async name => {
    const contract = await api("GET", "/api/contracts/" + encodeURIComponent(name));
    const approver = h("input", {placeholder: "your name"}), confirm = h("input", {placeholder: "first 12 digest characters", size: 26}), reason = h("input", {placeholder: "reason"});
    detail.replaceChildren(panel("Contract " + name,
      h("div", {class: "row"}, badge(contract.status), contract.proposal ? h("span", {class: "mono muted"}, contract.proposal.digest) : null),
      h("pre", {}, contract.agentscript),
      h("h3", {}, "Version history"), table(["Revision", "Change", "By", "At", "Digest"], contract.versions.map(version => [version.revision, version.action, version.by, new Date(version.at * 1000).toLocaleString(), h("code", {}, version.digest)])),
      contract.git_history.length ? table(["Commit", "Author", "Subject"], contract.git_history.map(commit => [h("code", {}, commit.commit.slice(0, 12)), commit.author, commit.subject])) : null,
      h("h3", {}, "Approval history"), table(["Revision", "Decision", "By", "At"], contract.approvals.map(approval => [approval.revision, badge(approval.action), approval.by, new Date(approval.at * 1000).toLocaleString()])),
      contract.proposal && contract.proposal.status === "pending" ? h("div", {class: "row"}, approver, confirm, h("button", {class: "act", onclick: async () => { try { await api("POST", "/api/contracts/" + name + "/approve", {approver: approver.value, confirm: confirm.value}); open(name); } catch (error) { alert(error.message); } }}, "Approve and activate"),
        reason, h("button", {class: "ghost", onclick: async () => { try { await api("POST", "/api/contracts/" + name + "/reject", {approver: approver.value, reason: reason.value}); open(name); } catch (error) { alert(error.message); } }}, "Reject")) : null,
      contract.draft ? h("button", {class: "ghost", onclick: () => { draft = contract.draft; window.scrollTo(0, 0); render(); }}, "Edit as a new draft") : null));
  };
  const packPanel = panel("Policy packs (recommendations only)", h("p", {class: "muted"}, "Packs read the repository and recommend; they never activate anything."),
    h("div", {}, packs.packs.map(pack => h("button", {class: "ghost", onclick: async () => {
      const result = await api("GET", "/api/packs/" + pack.pack);
      packOut.replaceChildren(h("h3", {}, pack.pack + " · " + pack.covers), h("pre", {}, JSON.stringify(result.summary, null, 2)),
        table(["Category", "Recommendation", "Status", "Suggestion"], result.recommendations.map(item => [item.category, item.entity || item.directory || item.framework || "", badge(item.status), h("code", {}, text(Object.values(item.suggestion || {})[0]))])),
        pack.pack === "payments" && result.proposed_policy ? h("button", {class: "act", onclick: async () => { try { const made = await api("POST", "/api/packs/payments/propose", {name: "payments_pack"}); packOut.prepend(h("div", {class: "notice"}, "Proposal " + made.proposal + " is pending review.")); } catch (error) { alert(error.message); } }}, "Turn into a pending proposal") : null);
    }}, pack.pack + " (" + pack.version + ")"))));
  const packOut = h("div", {}); packPanel.append(packOut);
  return h("div", {}, editor,
    panel("Contracts", h("p", {class: "muted"}, "Contract version " + text(data.contract_version)),
      h("h3", {}, "Active"), table(["Policy", "Rules", "Digest"], data.active.map(policy => [h("b", {}, policy.name), policy.draft ? policy.draft.rules.length : "invalid", h("code", {}, policy.digest.slice(7, 19))]), index => open(data.active[index].name)),
      h("h3", {}, "Proposals"), table(["Proposal", "Status", "Revision", "Origin"], data.proposals.map(proposal => [h("b", {}, proposal.name), badge(proposal.status), proposal.revision, text(proposal.origin && proposal.origin.kind)]), index => open(data.proposals[index].name))),
    detail, packPanel);
}

async function sessionsScreen() {
  const data = await api("GET", "/api/sessions"), detail = h("div", {});
  const open = async id => {
    const session = await api("GET", "/api/sessions/" + encodeURIComponent(id));
    detail.replaceChildren(panel("Session " + id,
      h("div", {class: "stats"}, stat(session.autonomy, "autonomy"), stat(session.safety, "safety"), stat(session.budget ? session.budget.current + " / " + session.budget.max : "–", "budget"), stat(session.actions.authorizations, "actions authorized"), stat(session.denied, "denied"), stat(session.violations.length, "violations"), stat(session.final_outcome.decision, "outcome")),
      h("h3", {}, "Agent behavior"), evidenceTable(session.evidence)));
  };
  return h("div", {}, panel("Agent sessions", table(["Session", "Agent", "Task", "Autonomy", "Safety", "Budget", "Actions", "Violations", "Tests", "Outcome"],
    data.sessions.map(session => [h("code", {}, session.session), session.agent.profile, text(session.task.task_id), session.autonomy, badge(session.safety), session.budget ? session.budget.current + " / " + session.budget.max : "–", session.actions.authorizations + " (" + session.denied + " denied)", session.violations.length, session.tests.contract ? session.tests.contract.passed + " passed, " + session.tests.contract.failed + " failed" : "–", badge(session.final_outcome.decision)]),
    index => open(data.sessions[index].session))), detail);
}

function evidenceTable(records) {
  return table(["#", "Category", "Event", "Tool", "Decision", "Budget", "Autonomy / safety", "Violations", "Repair", "Human"],
    records.map(record => [record.seq, record.category, record.event, record.tool ? record.tool + " " + record.operation : "", record.decision ? badge(record.decision) : "", record.budget.before.current === record.budget.after.current ? "" : record.budget.before.current + " → " + record.budget.after.current, record.autonomy + " / " + record.safety, record.violations.join(", "), record.repair ? record.repair.kind : "", record.human ? record.human.action : ""]));
}

async function simulatorScreen() {
  const out = h("div", {}), source = h("select", {}, h("option", {value: "draft"}, "the draft in the editor"));
  const contracts = await api("GET", "/api/contracts");
  contracts.proposals.forEach(proposal => source.append(h("option", {value: proposal.name}, "proposal " + proposal.name + " (" + proposal.status + ")")));
  const run = async () => {
    try {
      const result = await api("POST", "/api/simulate", source.value === "draft" ? {draft} : {proposal: source.value});
      const analysis = result.false_positive_analysis;
      out.replaceChildren(
        panel("Shadow evaluation of " + result.policy.name, h("p", {class: "muted"}, "Nothing is enforced; this replays " + result.actions_evaluated + " recorded actions from " + result.sessions_evaluated + " sessions."),
          table(["Rule", "Scope", "Resolves today", "Actions it would change", "Sessions affected", "Sessions a target would fail"], result.rules.map(rule => [h("code", {}, rule.rule), rule.scope + (rule.scope_approximate ? " (approximate)" : ""), badge(rule.resolution), rule.actions_changed, rule.sessions_affected.join(", "), rule.sessions_left_unmet.join(", ")]))),
        panel("Historical action impact", table(["Session", "#", "Tool", "Then", "Shadow", "Session outcome", "Classification"], result.impact.map(item => [h("code", {}, item.session), item.seq, item.tool + " " + item.operation, item.historical_decision, badge(item.shadow_decision), item.session_outcome, badge(item.classification)]))),
        panel("False-positive analysis", h("div", {class: "stats"}, stat(analysis.likely_true_positives, "likely true positives"), stat(analysis.likely_false_positives, "likely false positives"), stat(analysis.undetermined, "undetermined"), stat(analysis.false_positive_rate === null ? "–" : Math.round(analysis.false_positive_rate * 100) + "%", "false-positive rate")), h("p", {class: "muted"}, analysis.method)));
    } catch (error) { out.replaceChildren(h("div", {class: "notice bad"}, error.message)); }
  };
  return h("div", {}, panel("Policy simulator", h("div", {class: "row"}, "Simulate ", source, h("button", {class: "act", onclick: run}, "Run in shadow mode"))), out);
}

async function attestationsScreen() {
  const data = await api("GET", "/api/attestations"), detail = h("div", {});
  const open = async id => {
    const value = await api("GET", "/api/attestations/" + encodeURIComponent(id));
    const attestation = value.attestation;
    detail.replaceChildren(panel("Attestation " + id,
      h("div", {class: "row"}, badge(attestation.final_decision.decision), h("span", {class: "chip"}, "chain " + value.chain.status), value.matches_evidence ? badge("matches evidence") : badge("differs from evidence"), h("code", {}, attestation.attestation_digest)),
      h("div", {class: "split"}, h("pre", {}, JSON.stringify({task: attestation.task, contract: attestation.contract, checkpoints: attestation.checkpoints, policy_versions: attestation.policy_versions}, null, 2)),
        h("pre", {}, JSON.stringify({action_summary: attestation.action_summary, final_state: attestation.final_state, delivery: attestation.delivery}, null, 2))),
      h("h3", {}, "Full evidence trail"), evidenceTable(value.evidence)));
  };
  return h("div", {}, panel("Attestations", table(["Session", "Task", "Decision", "Merged as", "Evidence events", "Digest"],
    data.attestations.map(item => [h("code", {}, item.session), text(item.task), badge(item.decision), item.merged ? h("code", {}, item.merged.slice(0, 12)) : "–", item.events, h("code", {}, item.digest.slice(7, 23))]),
    index => open(data.attestations[index].session))), detail);
}

render();
</script>
</body>
</html>
